<script type="application/json" id="rr-data">[{% for r in respuestas %}{"atajo": "{{ r.atajo|escapejs }}", "titulo": "{{ r.titulo|escapejs }}", "texto": "{{ r.texto|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
<script>
(function () {
  const panel = document.getElementById('chatPanel'), msgs = document.getElementById('chatMsgs'), form = document.getElementById('chatForm');
  const vars = {primer_nombre: '{{ contacto.nombre|escapejs }}'.split(' ')[0], nombre: '{{ contacto.nombre|escapejs }}',
                agente: '{{ user.first_name|default:user.username|escapejs }}', embudo: '{{ op.embudo.nombre|default:""|escapejs }}'};
  const ids = msgs.querySelectorAll('[data-id]');
  let ultimo = ids.length ? parseInt(ids[ids.length - 1].dataset.id) : 0;
  const bajar = () => { msgs.scrollTop = msgs.scrollHeight; };
  bajar();
  if (!form) return;
  const ta = form.querySelector('textarea'), file = form.querySelector('[name=archivo]');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !rrAbierto()) { e.preventDefault(); form.requestSubmit(); } });
  file.addEventListener('change', () => { document.getElementById('adjuntoNombre').textContent = file.files[0] ? '📎 ' + file.files[0].name : ''; });

  async function enviar(fd) {
    const conv = panel.dataset.conv;
    if (!conv) fd.append('contacto', panel.dataset.contacto);
    const url = conv ? `/whatsapp/conversacion/${conv}/enviar/` : '/whatsapp/enviar/';
    const r = await CRM.api(url, {data: fd});
    const vacio = msgs.querySelector('.m-auto'); if (vacio) vacio.remove();
    msgs.insertAdjacentHTML('beforeend', r.html); bajar();
    if (!conv) { panel.dataset.conv = r.conv; const sel = form.querySelector('[name=linea]'); if (sel) sel.remove(); }
    ultimo = Math.max(ultimo, r.id);
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!ta.value.trim() && !file.files.length) return;
    const fd = new FormData(form);
    const btn = form.querySelector('.btn-success'); btn.disabled = true;
    try { await enviar(fd); ta.value = ''; file.value = ''; document.getElementById('adjuntoNombre').textContent = ''; ta.style.height = ''; }
    catch (err) { if (/24 h/.test(err.message)) document.getElementById('avisoVentana').style.display = ''; }
    finally { btn.disabled = false; ta.focus(); }
  });
  form.querySelectorAll('[data-plantilla]').forEach(a => a.addEventListener('click', async e => {
    e.preventDefault();
    if (!confirm('¿Enviar la plantilla "' + a.querySelector('b').textContent + '"?')) return;
    const fd = new FormData(); fd.append('plantilla', a.dataset.plantilla);
    const sel = form.querySelector('[name=linea]'); if (sel) fd.append('linea', sel.value);
    try { await enviar(fd); } catch (err) {}
  }));

  // Respuestas rápidas con "/"
  const rr = JSON.parse(document.getElementById('rr-data').textContent), menu = document.getElementById('rrMenu');
  let rrSel = 0, rrItems = [];
  const rrAbierto = () => menu.style.display === 'block';
  const completar = t => t.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
  ta.addEventListener('keyup', e => {
    if (['ArrowDown', 'ArrowUp', 'Enter', 'Escape'].includes(e.key)) return;
    const m = ta.value.match(/^\/(\w*)$/);
    if (!m) { menu.style.display = 'none'; return; }
    rrItems = rr.filter(r => r.atajo.startsWith(m[1]));
    rrSel = 0;
    menu.innerHTML = rrItems.map((r, i) => `<div class="item ${i === 0 ? 'sel' : ''}" data-i="${i}"><b>/${CRM.esc(r.atajo)}</b> <span class="muted">${CRM.esc(r.titulo)}</span></div>`).join('');
    menu.style.display = rrItems.length ? 'block' : 'none';
  });
  ta.addEventListener('keydown', e => {
    if (!rrAbierto()) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); rrSel = (rrSel + (e.key === 'ArrowDown' ? 1 : -1) + rrItems.length) % rrItems.length;
      menu.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('sel', i === rrSel)); }
    if (e.key === 'Enter') { e.preventDefault(); ta.value = completar(rrItems[rrSel].texto); menu.style.display = 'none'; }
    if (e.key === 'Escape') menu.style.display = 'none';
  });
  menu.addEventListener('click', e => { const it = e.target.closest('.item'); if (it) { ta.value = completar(rrItems[it.dataset.i].texto); menu.style.display = 'none'; ta.focus(); } });

  // Nuevos mensajes (polling cada 5 s solo mientras la pestaña está visible)
  setInterval(async () => {
    if (document.hidden || !panel.dataset.conv) return;
    try {
      const d = await CRM.api(`/whatsapp/conversacion/${panel.dataset.conv}/mensajes/?despues=${ultimo}&leer=1`, {silencioso: true});
      if (d.html.trim()) { msgs.insertAdjacentHTML('beforeend', d.html); ultimo = d.ultimo; bajar(); }
      Object.entries(d.estados || {}).forEach(([id, st]) => { const el = msgs.querySelector(`[data-id="${id}"] .st`); if (el) el.dataset.st = st, el.className = 'st bi ' + ({read: 'bi-check2-all leido', delivered: 'bi-check2-all', sent: 'bi-check2', failed: 'bi-exclamation-circle text-danger'}[st] || 'bi-clock'); });
      document.getElementById('avisoVentana').style.display = d.ventana ? 'none' : '';
    } catch (e) {}
  }, 5000);
})();
</script>
