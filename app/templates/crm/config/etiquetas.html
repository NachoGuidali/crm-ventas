{% extends "base.html" %}
{% block title %}Etiquetas{% endblock %}
{% block content %}
<div class="page-head"><h1><i class="bi bi-tags"></i> Etiquetas</h1></div>
<div class="row"><div class="col-lg-6"><div class="card"><div class="card-body">
  <form method="post" class="d-flex gap-2 mb-3">{% csrf_token %}{{ form.nombre }}{{ form.color }}<button class="btn btn-primary text-nowrap">Agregar</button></form>
  {% for e in etiquetas %}<div class="d-flex justify-content-between align-items-center py-1"><span class="chip" style="border-color:{{ e.color }};color:{{ e.color }}">{{ e }}</span><span class="small muted">{{ e.n }} contactos</span>
    {% if 'embudos' in perms_crm %}<form method="post">{% csrf_token %}<button name="eliminar" value="{{ e.pk }}" class="btn btn-xs btn-outline-danger"><i class="bi bi-trash"></i></button></form>{% endif %}</div>{% endfor %}
</div></div></div></div>
{% endblock %}
